[package]
name = "latex-rust"
version = "3.0.0"
edition = "2021"
rust-version = "1.99"
authors = ["Jeffrey S Carr <jscarr1964@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Pure-Rust LaTeX math renderer. Parse to AST, TeX-faithful layout on exact rationals, emit SVG, PNG, or egui shapes. No JavaScript, no webview, no runtime."
readme = "README.md"
repository = "https://github.com/jscarr64/LaTeX-Rust"
homepage = "https://github.com/jscarr64/LaTeX-Rust"
documentation = "https://docs.rs/latex-rust"
keywords = ["latex", "math", "rendering", "svg", "rust"]
categories = ["rendering", "science", "mathematics"]
include = [
    "src/**",
    "data/**",
    "fonts/**",
    "golds/**",
    "tests/**",
    "benches/layout.rs",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "README.md",
    "CONTRIBUTING.md",
    "CHANGELOG.md",
    "NOTICE",
    "documents/CAPABILITIES.md",
    "documents/SYMBOLS.md",
]

[lib]
name = "latex_rust"
path = "src/lib.rs"

[features]
default = ["std"]
std = []
# PNG raster backend (`src/render/png`).
png = ["dep:tiny-skia"]
# egui Shape backend (`src/render/egui`).
egui = ["dep:egui"]

[dev-dependencies]
proptest = "=1.5.0"
# rusty-fork (via proptest 1.5) pulls the newest tempfile. 3.27 needs
# getrandom 0.4, whose manifest requires Cargo edition2024. 1.83 cannot
# read that manifest. 3.14 stays on getrandom 0.2.
tempfile = "=3.14.0"

[dependencies]
# 0.39 is the last skrifa whose read-fonts (0.36) builds on the 1.83 CI
# toolchain. Later fontations need rustc 1.85 for the MATH table, so MATH
# is parsed in src/font/math.rs. Do not enable the `libm` feature.
skrifa = "=0.39.0"
tiny-skia = { version = "0.11", optional = true }
egui = { version = "0.28", optional = true }

[[bench]]
name = "layout"
harness = false
required-features = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
