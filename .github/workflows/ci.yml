name: ci

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test
      - name: test release
        run: cargo test --release

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The lockfile and the audit use the same toolchain as the test job.
      # cargo-audit 0.22.2 reads the current advisory DB on rustc 1.99.
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: lockfile
        run: cargo generate-lockfile
      - name: cargo-audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --version 0.12.0 --locked
      - name: fuzz smoke
        run: cargo +nightly fuzz run parse -- -max_total_time=60
