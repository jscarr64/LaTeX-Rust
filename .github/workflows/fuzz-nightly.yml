name: fuzz-nightly

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: release tests
        run: cargo test --release
      - uses: dtolnay/rust-toolchain@nightly
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --version 0.12.0 --locked
      - name: parse
        run: cargo fuzz run parse -- -max_total_time=960
      - name: preprocess
        run: cargo fuzz run preprocess -- -max_total_time=120
