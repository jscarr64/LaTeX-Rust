# Milestone 7 — multiline environments, numbering, array, substack.

[[gold]]
name = "aligned-two-ast"
kind = "ast"
input = "\\begin{aligned} f(x) &= x^2 + 2x + 1 \\\\ &= (x+1)^2 \\end{aligned}"
expect = "(matrix aligned ((row (atom Ord \"f\") (atom Open \"(\") (atom Ord \"x\") (atom Close \")\")) (row (atom Rel \"=\") (sup (atom Ord \"x\") (atom Ord \"2\")) (atom Bin \"+\") (atom Ord \"2\") (atom Ord \"x\") (atom Bin \"+\") (atom Ord \"1\"))) ((row) (row (atom Rel \"=\") (atom Open \"(\") (atom Ord \"x\") (atom Bin \"+\") (atom Ord \"1\") (sup (atom Close \")\") (atom Ord \"2\")))))"

[[gold]]
name = "aligned-two-dims"
kind = "dims"
style = "display"
input = "\\begin{aligned} f(x) &= x^2 + 2x + 1 \\\\ &= (x+1)^2 \\end{aligned}"
expect = "w=7.149166666666666666666666 h=0.8108 d=1.4028"

