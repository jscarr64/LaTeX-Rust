# Gold tests — Milestone 1
# Contract: code must match these values. Do not edit golds to hide a bug.

[[gold]]
name = "tok_frac"
kind = "tokenize"
input = "\\frac{1}{2}"
expect = "cmd:frac { char:1 } { char:2 }"

[[gold]]
name = "tok_super_sub"
kind = "tokenize"
input = "x_i^2"
expect = "char:x _ char:i ^ char:2"

[[gold]]
name = "tok_sqrt_index"
kind = "tokenize"
input = "\\sqrt[n]{x}"
expect = "cmd:sqrt char:[ char:n char:] { char:x }"

[[gold]]
name = "tok_sum_int"
kind = "tokenize"
input = "\\sum_{i=1}^{n}\\int_{a}^{b}"
expect = "cmd:sum _ { char:i char:= char:1 } ^ { char:n } cmd:int _ { char:a } ^ { char:b }"

[[gold]]
name = "tok_greek"
kind = "tokenize"
input = "\\alpha\\beta\\Gamma\\pi"
expect = "cmd:alpha cmd:beta cmd:Gamma cmd:pi"

[[gold]]
name = "tok_inline_dollar"
kind = "tokenize"
input = "$x$"
expect = "$ char:x $"

[[gold]]
name = "tok_display_dollar"
kind = "tokenize"
input = "$$x$$"
expect = "$$ char:x $$"

[[gold]]
name = "tok_display_bracket"
kind = "tokenize"
input = "\\[x\\]"
expect = "cmd:[ char:x cmd:]"

[[gold]]
name = "tok_inline_paren"
kind = "tokenize"
input = "\\(x\\)"
expect = "cmd:( char:x cmd:)"

[[gold]]
name = "tok_comment"
kind = "tokenize"
input = "a% hide\nb"
expect = "char:a char:b"

[[gold]]
name = "tok_trailing_backslash"
kind = "tokenize_err"
input = "x\\"
expect = "trailing backslash"

