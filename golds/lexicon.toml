[[gold]]
name = "prime-one"
flags = "prime_symbol"
input = "f'"
pair = "f^{\\prime}"
expect = "(sup (atom Ord \"f\") (symbol prime))"

[[gold]]
name = "prime-two"
flags = "prime_symbol"
input = "f''"
pair = "f^{\\prime\\prime}"
expect = "(sup (atom Ord \"f\") (row (symbol prime) (symbol prime)))"

[[gold]]
name = "prime-three-stays-nested"
flags = "prime_symbol"
input = "f'''"
pair = ""
expect = "(sup (atom Ord \"f\") (row (row (symbol prime) (symbol prime)) (symbol prime)))"
forbid = "(sup (atom Ord \"f\") (row (symbol prime) (symbol prime) (symbol prime)))"
